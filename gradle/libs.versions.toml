[versions]
minSdk = "21"
compileSdk = "35"
kotlin = "2.3.10" # https://kotlinlang.org/docs/releases.html#release-details
agp = "8.13.2"  # https://maven.google.com/web/index.html?q=gradle.plugin#com.android.library:com.android.library.gradle.plugin
androidx-compose-ui = "1.8.1"   # https://developer.android.com/jetpack/androidx/releases/compose-ui
androidx-compose-ui-material3 = "1.3.2"  # https://developer.android.com/jetpack/androidx/releases/compose-material3
androidx-appcompat = "1.7.1"
androidx-lifecycle = "2.9.1" # https://developer.android.com/jetpack/androidx/releases/lifecycle
androidx-savedstate = "1.3.0" # https://developer.android.com/jetpack/androidx/releases/savedstate
androidx-ktx = "1.16.0" # https://developer.android.com/kotlin/ktx#core
androidx-activity = "1.10.1"  # https://developer.android.com/jetpack/androidx/releases/activity
paparazzi = "2.0.0-alpha04" # https://github.com/cashapp/paparazzi/releases
telephoto = "0.18.0" # https://github.com/saket/telephoto/releases
dokka = "2.0.0" # https://github.com/kotlin/dokka/releases
junit = "4.13.2"
composeLintChecks = "1.4.2" # https://github.com/slackhq/compose-lints/releases
androidx-test-core = "1.6.1"
mavenPublish = "0.35.0" # https://vanniktech.github.io/gradle-maven-publish-plugin/changelog/

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }

[libraries]
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose-ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidx-compose-ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-compose-ui-material3" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-ktx" }
androidx-lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-savedstate = { module = "androidx.savedstate:savedstate-ktx", version.ref = "androidx-savedstate" }
composeLintChecks = { module = "com.slack.lint.compose:compose-lint-checks", version.ref = "composeLintChecks" }
paparazzi = { module = "app.cash.paparazzi:paparazzi", version.ref = "paparazzi" }
telephoto = { module = "me.saket.telephoto:zoomable", version.ref = "telephoto" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-compose-ui-test-junit = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose-ui" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
